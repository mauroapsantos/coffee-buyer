name: update-catalog

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scraper/update.js
      - run: node scraper/copy-catalog.js
      - run: npm run build:single
        working-directory: app
      - name: Commit catalog update
        run: |
          git config user.name "coffee-buyer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json app/src/data/catalog.json app/dist-single/index.html
          git diff --cached --quiet || git commit -m "chore: update coffee catalog"
          git push
